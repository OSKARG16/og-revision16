<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140224" />
      <stop offset="40%" stop-color="#2e0854" />
      <stop offset="75%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e0938" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#07000d" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background (rounded squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="220" r="230" fill="url(#glowGrad)" />

  <!-- Subtle glowing border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Graduation Cap Motif -->
  <g transform="translate(256, 105)" filter="url(#shadow)">
    <polygon points="0,-22 42,-6 0,10 -42,-6" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
    <path d="M -26 4 L -26 21 C -12 28 12 28 26 21 L 26 4 Z" fill="#d97706" />
    <path d="M 30 0 L 36 18 L 33 19 L 27 1" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="36" cy="20" r="3.5" fill="#fef08a" />
  </g>

  <!-- OG Big Letters -->
  <text x="256" y="278"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="162"
        font-weight="900"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#textGrad)"
        filter="url(#shadow)">OG</text>

  <!-- Luminous Accent Horizon Bar -->
  <rect x="86" y="312" width="340" height="4" rx="2" fill="url(#lineGrad)" />

  <!-- REVISION Subtitle Just Below -->
  <text x="256" y="375"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="44"
        font-weight="800"
        letter-spacing="14"
        text-anchor="middle"
        fill="#e9d5ff"
        filter="url(#shadow)">REVISION</text>

  <!-- Star sparks -->
  <circle cx="115" cy="155" r="2.5" fill="#c084fc" opacity="0.8" />
  <circle cx="400" cy="165" r="2" fill="#c084fc" opacity="0.8" />
  <circle cx="130" cy="410" r="2" fill="#a855f7" opacity="0.6" />
  <circle cx="380" cy="415" r="2.5" fill="#a855f7" opacity="0.6" />
</svg>